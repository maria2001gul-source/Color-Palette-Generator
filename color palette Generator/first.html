<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color palette Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="container">
        <h1>Color Palette Generator</h1>
        <button id="generate-btn">
            <i class="fas fa-sync-alt"></i>
            Generate Palette
        </button>
        <div class="palette-container">
            <!-- BOX 1 -->
            <div class="color-box">
                <div class="color" style="background-color: #E1F5FE;"></div>
                <div class="color-info">
                    <span class="hex-value">#E1F5FE</span>
                        <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <!-- BOX 2 -->
             <div class="color-box">
                <div class="color" style="background-color: #FFE4F6;"></div>
                <div class="color-info">
                    <span class="hex-value">#FFE4F6</span>
                        <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <!-- BOX 3 -->
             <div class="color-box">
                <div class="color" style="background-color: #930031;"></div>
                <div class="color-info">
                    <span class="hex-value">#930031</span>
                        <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <!-- BOX 4 -->
             <div class="color-box">
                <div class="color" style="background-color: #09251C;"></div>
                <div class="color-info">
                    <span class="hex-value">#09251C</span>
                        <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <!-- BOX 5 -->
             <div class="color-box">
                <div class="color" style="background-color: #202734;"></div>
                <div class="color-info">
                    <span class="hex-value">#202734</span>
                        <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
